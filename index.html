<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IELTS cho Mập</title>
<link rel="icon" href="assets/logo-cut.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&family=Merriweather:wght@400;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<script>
  // Bump VERSION on every deploy so browsers fetch the new files instead of cached ones.
  var VERSION = "73";
  document.write('<link rel="stylesheet" href="app.css?v=' + VERSION + '">');
</script>
</head>
<body>
<div id="app"></div>
<script>
  // one data file per book; each calls IELTS.addBook(...) / addScripts(...) / addReading(...)
  ["app.js", "data/c13.js", "data/c14.js", "data/c15.js", "data/c16.js", "data/c17.js", "data/c18.js", "data/c19.js", "data/c20.js", "data/c21.js", "data/c13-reading.js", "data/c14-reading.js", "data/c15-reading.js", "data/c16-reading.js", "data/c17-reading.js", "data/c13-scripts.js", "data/c14-scripts.js", "data/c15-scripts.js", "data/c16-scripts.js", "data/c17-scripts.js", "data/practice-reading.js", "data/recent-writing.js", "data/v1.js", "data/v2.js", "data/v3.js", "data/v4.js", "data/v5.js", "data/v6.js", "data/v7.js", "data/v8.js", "data/v9.js", "data/vol-supplement.js", "data/question-types.js", "data/audio-starts.js"]
    .forEach(function (f) { document.write('<script src="' + f + '?v=' + VERSION + '"><\/script>'); });
</script>
<script>IELTS.start();</script>
</body>
</html>
