<script>

  document.write('<link rel="stylesheet" href="app.css?v=' + VERSION + '">');
</script>

<body>
<div id="app"></div>
<script>
  // one data file per book; each calls IELTS.addBook(...) / addScripts(...)
  ["app.js", "data/c13.js", "data/c14.js", "data/c15.js", "data/c16.js", "data/c17.js", "data/c13-scripts.js", "data/c14-scripts.js", "data/c15-scripts.js", "data/c16-scripts.js", "data/c17-scripts.js"]
    .forEach(function (f) { document.write('<script src="' + f + '?v=' + VERSION + '"><\/script>'); });
</script>
<script>IELTS.start();</script>
</body>
